<!DOCTYPE html>
<html lang="ko">
<head>
    <!-- 문서 문자 인코딩 설정 -->
    <meta charset="UTF-8">
    <!-- 모바일 화면 반응형 뷰포트 설정 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 웹페이지 제목 -->
    <title>실시간 대기오염 정보 조회</title>
    <!-- 외부 스타일시트 연결 -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 전체 페이지 컨테이너 -->
    <div class="container">
        <!-- 헤더 영역 -->
        <header class="header">
            <!-- 메인 타이틀 -->
            <h1>실시간 대기오염 정보</h1>
            <!-- 시도 선택 드롭다운 영역 -->
            <div class="select-box">
                <label for="sidoSelect">지역 선택:</label>
                <select id="sidoSelect">
                    <option value="전국">전국</option>
                    <option value="서울" selected>서울</option>
                    <option value="부산">부산</option>
                    <option value="대구">대구</option>
                    <option value="인천">인천</option>
                    <option value="광주">광주</option>
                    <option value="대전">대전</option>
                    <option value="울산">울산</option>
                    <option value="세종">세종</option>
                    <option value="경기">경기</option>
                    <option value="강원">강원</option>
                    <option value="충북">충북</option>
                    <option value="충남">충남</option>
                    <option value="전북">전북</option>
                    <option value="전남">전남</option>
                    <option value="경북">경북</option>
                    <option value="경남">경남</option>
                    <option value="제주">제주</option>
                </select>
            </div>
        </header>

        <!-- 지역 평균 미세먼지 수치 표시 영역 -->
        <section class="summary-section">
            <div class="average-card">
                <h2>선택 지역 평균 미세먼지 (PM10)</h2>
                <!-- 평균 수치 텍스트 -->
                <div class="average-value" id="averageValue">- <span>㎍/㎥</span></div>
                <!-- 평균 등급 텍스트 안내 -->
                <p class="average-status" id="averageStatus">데이터를 불러오는 중입니다...</p>
            </div>
        </section>

        <!-- 등급 색상 범례 안내 -->
        <section class="legend">
            <span class="badge grade-1">좋음 (1)</span>
            <span class="badge grade-2">보통 (2)</span>
            <span class="badge grade-3">나쁨 (3)</span>
            <span class="badge grade-4">매우나쁨 (4)</span>
            <span class="badge grade-unknown">측정 안 됨</span>
        </section>

        <!-- 측정소별 카드 목록 영역 -->
        <main>
            <div class="station-grid" id="stationGrid">
                <!-- 측정소 카드들이 자바스크립트로 동적 생성됨 -->
            </div>
        </main>
    </div>

    <!-- 외부 자바스크립트 파일 연결 -->
    <script src="script.js"></script>
</body>
</html>
